# 树屋项目 Nginx 配置示例
# 用法: 修改 server_name 与证书路径后, 放到 /etc/nginx/sites-available/wzone
#       并软链到 sites-enabled, nginx -t 通过后 reload
# 架构: 单域名同源部署 —— 主应用 / 子应用 / 后端 API 全部收在一个入口下

server {
    listen 80;
    server_name your-domain.com;          # 改成你的域名或服务器 IP

    # 视频上传大小上限, 与后端 express.json limit(50mb) 保持一致
    client_max_body_size 50m;

    # gzip 压缩静态资源
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # ---------- 主应用 (React, history 路由) ----------
    location / {
        root /home/lighthouse/web/shuwu/main;
        index index.html;
        # BrowserRouter 刷新不 404: 未命中文件时回退 index.html
        try_files $uri /index.html;
    }

    # ---------- 子应用: 摄像头监控 (qiankun entry /apps/cameras/) ----------
    location /apps/cameras/ {
        alias /home/lighthouse/web/shuwu/cameras/;
        index index.html;
        try_files $uri /apps/cameras/index.html;
    }

    # ---------- 子应用: 管理后端 (qiankun entry /apps/admin/) ----------
    location /apps/admin/ {
        alias /home/lighthouse/web/shuwu/admin/;
        index index.html;
        try_files $uri /apps/admin/index.html;
    }

    # ---------- 后端 API ----------
    location /api/ {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 实时通知(/api/notification/stream)关键配置:
        # 必须关闭响应缓冲, 否则事件被 Nginx 攒着, 前端收不到实时推送
        proxy_buffering off;
        proxy_cache off;
        # SSE 是长连接, 拉长读超时避免空闲断连(后端另有 25s 心跳)
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---------- 上传的视频/图片静态资源 ----------
    location /uploads/ {
        proxy_pass http://127.0.0.1:9000;
        proxy_set_header Host $host;
        expires 7d;                        # 静态资源浏览器缓存
        add_header Cache-Control "public";
    }

    # ---------- 静态资源长缓存(带 contenthash, 可放心缓存) ----------
    location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpe?g|gif)$ {
        root /home/lighthouse/web/shuwu;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}

